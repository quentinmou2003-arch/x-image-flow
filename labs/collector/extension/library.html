<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾图 · 收藏实验室</title><link rel="stylesheet" href="library.css"></head>
<body>
  <header><div><div class="brand"><span class="mark">▦</span> 收藏实验室 <span class="lab">LAB 01</span></div><p>把喜欢的画面，留在自己的库里。</p></div><div class="header-actions"><button id="export">导出收藏 ZIP</button><button id="home" class="primary">回 X 收图</button></div></header>
  <main>
    <section class="overview"><div><small>收藏推文</small><b id="post-count">0</b></div><div><small>独立原图</small><b id="image-count">0</b></div><div><small>本地容量</small><b id="bytes">0 MB</b></div><p>原图与出处只保存在本机。<br>已复制不等于已发送，请手动确认。</p></section>
    <section class="toolbar"><input id="search" type="search" placeholder="搜索作者、标签、推文编号…" aria-label="搜索收藏"><select id="state" aria-label="处理状态"><option value="all">全部状态</option><option value="saved">待处理</option><option value="copied">已复制</option><option value="sent">已发送 · 手动确认</option></select><span id="results"></span></section>
    <div id="grid" class="grid"></div><div id="empty" class="empty" hidden><b>从第一张图开始。</b><p>在 X 的拾图卡片点「收下」，原图和来源会一起保存。<br>这里可以搜索、打标签、复制、导出和整理处理进度。</p><button id="empty-home" class="primary">去 X 收图</button></div>
    <button id="more" hidden>加载更多收藏</button>
    <footer>收藏实验室 2.4.0-lab.1 · 原图留在本机 · 卸载前请导出收藏 ZIP</footer>
  </main>
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <dialog id="preview"><button id="close-preview" aria-label="关闭预览">关闭</button><img alt="本地原图"><div><button id="copy-preview" class="primary">复制这张 PNG</button><button id="download-preview">导出这张原图</button></div></dialog>
  <script src="shared.js"></script><script src="library-store.js"></script><script src="archive-zip.js"></script><script src="clipboard.js"></script><script src="library.js"></script>
</body></html>
